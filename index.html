<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferragine - SAAAALVEEE!</title>
  <style>
    html, body {
      margin: 0;
      background: #0f1115;
      color: #fff;
      font-family: sans-serif;
    }
    #wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 8px;
    }
    canvas {
      width: 100%;
      display: block;
      background: #8ec9ff;
      border-radius: 10px;
      touch-action: none;
    }
    #controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      flex: 1;
      font-size: 20px;
      padding: 16px 0;
      border: 0;
      border-radius: 10px;
      background: #ffd23f;
      font-weight: bold;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      cursor: pointer;
    }
    #hello { background: #e63946; color: #fff; flex: 2; }
    #repair { background: #2a9d8f; color: #fff; flex: 1.2; font-size: 16px; }
    p { font-size: 13px; opacity: .7; margin: 8px 2px; }
    .status {
      position: absolute;
      left: 50%;
      top: 26px;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: 28px;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="800" height="450"></canvas>
    <div id="controls">
      <button id="left">◀</button>
      <button id="hello">SAAAALVEEE!</button>
      <button id="right">▶</button>
      <button id="repair">Ripara</button>
    </div>
    <p>Freccie ← → per camminare, SPAZIO per salutare, R per riparare la città. Dopo 7 crepe un palazzo crolla. Saluta mentre passa un aereo e lo abbatti! L'auto nera parcheggiata fa partire l'allarme. Se non senti nulla: alzà il volume e, su iPhone, togli il silenzioso.</p>
  </div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      const radius = Math.min(r || 0, w / 2, h / 2);
      this.beginPath();
      this.moveTo(x + radius, y);
      this.lineTo(x + w - radius, y);
      this.quadraticCurveTo(x + w, y, x + w, y + radius);
      this.lineTo(x + w, y + h - radius);
      this.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      this.lineTo(x + radius, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - radius);
      this.lineTo(x, y + radius);
      this.quadraticCurveTo(x, y, x + radius, y);
      this.closePath();
      return this;
    };
  }

  const W = canvas.width, H = canvas.height;
  const GROUND = 380;
  const COLLAPSE_AT = 7;
  const strings = {
    fail: "FERRAGINE PERDE!",
    stop: "Bingos lo ha morso alla gamba!",
    hidden: "LAMEZIA TERME"
  };

  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- AUDIO ----------
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function noiseBuffer(ac, seconds) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function formantVoice() {
    const ac = getAudio();
    if (!ac) return;
    const t0 = ac.currentTime + 0.03;
    const END = t0 + 2.0;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.ratio.value = 6;
    comp.connect(ac.destination);

    const shaper = ac.createWaveShaper();
    const curve = new Float32Array(512);
    for (let i = 0; i < 512; i++) {
      const x = (i / 511) * 2 - 1;
      curve[i] = Math.tanh(x * 2.5);
    }
    shaper.curve = curve;

    const voiced = ac.createGain();
    voiced.gain.setValueAtTime(0.0001, t0);
    voiced.gain.setValueAtTime(0.0001, t0 + 0.12);
    voiced.gain.exponentialRampToValueAtTime(1.0, t0 + 0.22);
    voiced.gain.setValueAtTime(1.0, t0 + 0.8);
    voiced.gain.linearRampToValueAtTime(0.45, t0 + 0.92);
    voiced.gain.linearRampToValueAtTime(0.35, t0 + 1.02);
    voiced.gain.linearRampToValueAtTime(1.0, t0 + 1.12);
    voiced.gain.setValueAtTime(1.0, t0 + 1.7);
    voiced.gain.exponentialRampToValueAtTime(0.0001, END);
    voiced.connect(shaper);
    shaper.connect(comp);

    const oscs = [];
    const lfo = ac.createOscillator();
    lfo.frequency.value = 5.5;
    const lfoGain = ac.createGain();
    lfoGain.gain.value = 3;
    lfo.connect(lfoGain);
    lfo.start(t0);
    lfo.stop(END);

    const src = ac.createGain();
    src.gain.value = 0.9;
    [1, 1.007].forEach(mult => {
      const o = ac.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(105 * mult, t0 + 0.12);
      o.frequency.linearRampToValueAtTime(140 * mult, t0 + 0.5);
      o.frequency.linearRampToValueAtTime(132 * mult, t0 + 0.85);
      o.frequency.linearRampToValueAtTime(118 * mult, t0 + 1.2);
      o.frequency.linearRampToValueAtTime(92 * mult, END);
      lfoGain.connect(o.frequency);
      o.connect(src);
      o.start(t0);
      o.stop(END);
      oscs.push(o);
    });

    const formants = [
      { a: 800, l: 400, e: 500, g: 1.6 },
      { a: 1200, l: 1100, e: 1900, g: 1.2 },
      { a: 2700, l: 2600, e: 2600, g: 0.6 }
    ];
    formants.forEach(f => {
      const bp = ac.createBiquadFilter();
      bp.type = "bandpass";
      bp.Q.value = 5;
      bp.frequency.setValueAtTime(f.a, t0 + 0.12);
      bp.frequency.setValueAtTime(f.a, t0 + 0.8);
      bp.frequency.linearRampToValueAtTime(f.l, t0 + 0.92);
      bp.frequency.linearRampToValueAtTime(f.l, t0 + 1.0);
      bp.frequency.linearRampToValueAtTime(f.e, t0 + 1.15);
      const g = ac.createGain();
      g.gain.value = f.g;
      src.connect(bp);
      bp.connect(g);
      g.connect(voiced);
    });

    const n = ac.createBufferSource();
    n.buffer = noiseBuffer(ac, 0.3);
    const hp = ac.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 3500;
    const ng = ac.createGain();
    ng.gain.setValueAtTime(0.0001, t0);
    ng.gain.linearRampToValueAtTime(0.35, t0 + 0.05);
    ng.gain.linearRampToValueAtTime(0.0001, t0 + 0.18);
    n.connect(hp);
    hp.connect(ng);
    ng.connect(comp);
    n.start(t0);
    n.stop(t0 + 0.3);

    const n2 = ac.createBufferSource();
    n2.buffer = noiseBuffer(ac, 0.35);
    const bp2 = ac.createBiquadFilter();
    bp2.type = "bandpass";
    bp2.frequency.value = 1800;
    const ng2 = ac.createGain();
    ng2.gain.setValueAtTime(0.0001, t0 + 0.9);
    ng2.gain.linearRampToValueAtTime(0.15, t0 + 0.98);
    ng2.gain.linearRampToValueAtTime(0.0001, t0 + 1.1);
    n2.connect(bp2);
    bp2.connect(ng2);
    ng2.connect(comp);
    n2.start(t0 + 0.9);
    n2.stop(t0 + 1.25);
  }

  function rumble() {
    const ac = getAudio();
    if (!ac) return;
    const t = ac.currentTime;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.7, t + 0.15);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    const filter = ac.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 420;
    [55, 82, 110, 144].forEach(f => {
      const o = ac.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.6, t + 2.2);
      o.connect(filter);
      o.start(t);
      o.stop(t + 2.3);
    });
    filter.connect(gain);
    gain.connect(ac.destination);
  }

  // There is more game code below; this patch only adds the browser-safe fallback.
})();
</script>
</body>
</html>
