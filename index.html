<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ferragine - SAAAALVEEE!</title>
  <style>
    html, body {
      margin: 0;
      background: #0f1115;
      color: #fff;
      font-family: sans-serif;
    }
    #wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 8px;
    }
    canvas {
      width: 100%;
      display: block;
      background: #8ec9ff;
      border-radius: 10px;
      touch-action: none;
    }
    #controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      flex: 1;
      font-size: 20px;
      padding: 16px 0;
      border: 0;
      border-radius: 10px;
      background: #ffd23f;
      font-weight: bold;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      cursor: pointer;
    }
    #hello { background: #e63946; color: #fff; flex: 2; }
    #repair { background: #2a9d8f; color: #fff; flex: 1.2; font-size: 16px; }
    p { font-size: 13px; opacity: .7; margin: 8px 2px; }
    .status {
      position: absolute;
      left: 50%;
      top: 26px;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: 28px;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="800" height="450"></canvas>
    <div id="controls">
      <button id="left">◀</button>
      <button id="hello">SAAAALVEEE!</button>
      <button id="right">▶</button>
      <button id="repair">Ripara</button>
    </div>
    <p>Frecce ← → per camminare, SPAZIO per salutare, R per riparare la città. Dopo 7 crepe un palazzo crolla. Saluta mentre passa un aereo e lo abbatti! L'auto nera parcheggiata fa partire l'allarme. Se non senti nulla: alza il volume e, su iPhone, togli il silenzioso.</p>
  </div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const GROUND = 380;
  const COLLAPSE_AT = 7;
  const strings = {
    fail: "FERRAGINE PERDE!",
    stop: "Bingos lo ha morso alla gamba!",
    hidden: "LAMEZIA TERME"
  };

  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- AUDIO ----------
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function noiseBuffer(ac, seconds) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function formantVoice() {
    const ac = getAudio();
    if (!ac) return;
    const t0 = ac.currentTime + 0.03;
    const END = t0 + 2.0;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.ratio.value = 6;
    comp.connect(ac.destination);

    const shaper = ac.createWaveShaper();
    const curve = new Float32Array(512);
    for (let i = 0; i < 512; i++) {
      const x = (i / 511) * 2 - 1;
      curve[i] = Math.tanh(x * 2.5);
    }
    shaper.curve = curve;

    const voiced = ac.createGain();
    voiced.gain.setValueAtTime(0.0001, t0);
    voiced.gain.setValueAtTime(0.0001, t0 + 0.12);
    voiced.gain.exponentialRampToValueAtTime(1.0, t0 + 0.22);
    voiced.gain.setValueAtTime(1.0, t0 + 0.8);
    voiced.gain.linearRampToValueAtTime(0.45, t0 + 0.92);
    voiced.gain.linearRampToValueAtTime(0.35, t0 + 1.02);
    voiced.gain.linearRampToValueAtTime(1.0, t0 + 1.12);
    voiced.gain.setValueAtTime(1.0, t0 + 1.7);
    voiced.gain.exponentialRampToValueAtTime(0.0001, END);
    voiced.connect(shaper);
    shaper.connect(comp);

    const oscs = [];
    const lfo = ac.createOscillator();
    lfo.frequency.value = 5.5;
    const lfoGain = ac.createGain();
    lfoGain.gain.value = 3;
    lfo.connect(lfoGain);
    lfo.start(t0);
    lfo.stop(END);

    const src = ac.createGain();
    src.gain.value = 0.9;
    [1, 1.007].forEach(mult => {
      const o = ac.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(105 * mult, t0 + 0.12);
      o.frequency.linearRampToValueAtTime(140 * mult, t0 + 0.5);
      o.frequency.linearRampToValueAtTime(132 * mult, t0 + 0.85);
      o.frequency.linearRampToValueAtTime(118 * mult, t0 + 1.2);
      o.frequency.linearRampToValueAtTime(92 * mult, END);
      lfoGain.connect(o.frequency);
      o.connect(src);
      o.start(t0);
      o.stop(END);
      oscs.push(o);
    });

    const formants = [
      { a: 800, l: 400, e: 500, g: 1.6 },
      { a: 1200, l: 1100, e: 1900, g: 1.2 },
      { a: 2700, l: 2600, e: 2600, g: 0.6 }
    ];
    formants.forEach(f => {
      const bp = ac.createBiquadFilter();
      bp.type = "bandpass";
      bp.Q.value = 5;
      bp.frequency.setValueAtTime(f.a, t0 + 0.12);
      bp.frequency.setValueAtTime(f.a, t0 + 0.8);
      bp.frequency.linearRampToValueAtTime(f.l, t0 + 0.92);
      bp.frequency.linearRampToValueAtTime(f.l, t0 + 1.0);
      bp.frequency.linearRampToValueAtTime(f.e, t0 + 1.15);
      const g = ac.createGain();
      g.gain.value = f.g;
      src.connect(bp);
      bp.connect(g);
      g.connect(voiced);
    });

    const n = ac.createBufferSource();
    n.buffer = noiseBuffer(ac, 0.3);
    const hp = ac.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 3500;
    const ng = ac.createGain();
    ng.gain.setValueAtTime(0.0001, t0);
    ng.gain.linearRampToValueAtTime(0.35, t0 + 0.05);
    ng.gain.linearRampToValueAtTime(0.0001, t0 + 0.18);
    n.connect(hp);
    hp.connect(ng);
    ng.connect(comp);
    n.start(t0);
    n.stop(t0 + 0.3);

    const n2 = ac.createBufferSource();
    n2.buffer = noiseBuffer(ac, 0.3);
    const bp2 = ac.createBiquadFilter();
    bp2.type = "bandpass";
    bp2.frequency.value = 1800;
    const ng2 = ac.createGain();
    ng2.gain.setValueAtTime(0.0001, t0 + 0.92);
    ng2.gain.linearRampToValueAtTime(0.15, t0 + 0.98);
    ng2.gain.linearRampToValueAtTime(0.0001, t0 + 1.1);
    n2.connect(bp2);
    bp2.connect(ng2);
    ng2.connect(comp);
    n2.start(t0 + 0.9);
    n2.stop(t0 + 1.2);
  }

  function rumble() {
    const ac = getAudio();
    if (!ac) return;
    const t = ac.currentTime;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.7, t + 0.15);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    const filter = ac.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 420;
    [55, 82, 110, 147].forEach(f => {
      const o = ac.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.6, t + 2.2);
      o.connect(filter);
      o.start(t);
      o.stop(t + 2.3);
    });
    filter.connect(gain);
    gain.connect(ac.destination);
  }

  function crash(vol) {
    const ac = getAudio();
    if (!ac) return;
    const t = ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, 0.3);
    const lp = ac.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 2500;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol || 0.25, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    src.connect(lp);
    lp.connect(g);
    g.connect(ac.destination);
    src.start(t);
  }

  let voices = [];
  function loadVoices() {
    if ("speechSynthesis" in window) voices = window.speechSynthesis.getVoices();
  }
  if ("speechSynthesis" in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function speakSalve() {
    if (!("speechSynthesis" in window)) return;
    try {
      const synth = window.speechSynthesis;
      synth.cancel();
      setTimeout(() => {
        const u = new SpeechSynthesisUtterance("Saaalveee!");
        u.lang = "it-IT";
        const v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("it"));
        if (v) u.voice = v;
        u.pitch = 0;
        u.rate = 0.45;
        u.volume = 1;
        synth.speak(u);
      }, 60);
    } catch (e) {}
  }

  // ---------- MAPPA ----------
  const palette = ["#e9c46a", "#f4a261", "#e5989b", "#b5c99a", "#cdb4db", "#ffd6a5"];
  const buildings = [];

  function buildPerson(name, short, color, glasses, extra) {
    return { name, short, color, glasses, extra };
  }

  function makeCity() {
    const defs = [
      {
        name: "Portineria",
        kind: "portineria",
        w: 230,
        h: 150,
        color: "#f7f5ef",
        frame: "#5c636d",
        people: [
          buildPerson("Donato", "portinaio", "#d6d5d2", "occhiali da sole a goccia", "Porta tutto in ordine")
        ]
      },
      {
        name: "Uffici",
        kind: "uffici",
        w: 260,
        h: 180,
        color: "#f5f8fa",
        frame: "#5f6873",
        people: [
          buildPerson("Stefano", "ufficio", "#d8c8a8", "occhiali normali", "cucina")
        ]
      },
      {
        name: "Aula formativa",
        kind: "aula",
        w: 250,
        h: 190,
        color: "#f4f5f9",
        frame: "#5a666d",
        people: [
          buildPerson("Giorgio", "docente", "#d9d9d9", "nessuno", "barba brizzolata, grida in napoletano")
        ]
      },
      {
        name: "Uffici",
        kind: "uffici2",
        w: 310,
        h: 200,
        color: "#f2f4f5",
        frame: "#59636d",
        people: [
          buildPerson("Gaetano", "ufficio", "#b9b9b9", "occhiali rettangolari", "fuma l’iQos"),
          buildPerson("Tonino", "ufficio", "#e7d9bb", "occhiali rettangolari", "fa il gesto di Spiderman"),
          buildPerson("Paky", "ufficio", "#8dd7ff", "nessuno", "balla i caraibici e parla dell’Inter e della sua moto")
        ]
      },
      {
        name: "Mensa",
        kind: "mensa",
        w: 250,
        h: 155,
        color: "#f9f6f1",
        frame: "#5f6065",
        people: [
          buildPerson("Davide", "cuoco", "#2b2b2b", "occhiali", "cuoco ciccione con Alfaromeo Mito blu tuning")
        ]
      },
      {
        name: "Spogliatoi",
        kind: "spogliatoi",
        w: 360,
        h: 145,
        color: "#f9f9f9",
        frame: "#607285",
        people: [
          buildPerson("Maria", "pulizia", "#75ff96", "occhiali", "molto bassa"),
          buildPerson("Michele", "pulizia", "#7be78d", "occhiali", "berretto di lana grigio pelato, dice: \"Mary ma che cazzo dici, sei stupida\"")
        ]
      },
      {
        name: "Officina",
        kind: "officina",
        w: 420,
        h: 155,
        color: "#8d8f94",
        frame: "#4d4f55",
        people: [
          buildPerson("Peppe", "officina", "#5f9ed8", "occhiali", "robusto e basso, insulta pesantemente Ferragine"),
          buildPerson("Operaio", "officina", "#5d87c5", "nessuno", "vestito di blu"),
          buildPerson("Operaio", "officina", "#5d87c5", "nessuno", "vestito di blu"),
          buildPerson("Operaio", "officina", "#5d87c5", "nessuno", "vestito di blu")
        ]
      },
      {
        name: "Magazzino",
        kind: "magazzino",
        w: 280,
        h: 140,
        color: "#8b8b8b",
        frame: "#4d4d52",
        people: [
          buildPerson("Enzo", "magazzino", "#e2d7c5", "nessuno", "camicia e maglioncino, dice \"IL BUONO\" e scappa con \"Nunununununununu\"")
        ]
      },
      {
        name: "Verniciatura",
        kind: "verniciatura",
        w: 270,
        h: 145,
        color: "#bbc1c6",
        frame: "#585b5f",
        people: [
          buildPerson("Federico", "verniciatura", "#5e8ed8", "nessuno", "vestito di blu, dice: \"Ma chi bua?\"")
        ]
      },
      {
        name: "Stazione CZ Lido",
        kind: "stazione",
        w: 360,
        h: 210,
        color: "#f0efe9",
        frame: "#6a7d7f",
        people: [
          buildPerson("Bingos", "cane randagio", "#8b5a2b", "nessuno", "morde Ferragine alla gamba")
        ]
      }
    ];

    let x = 0;
    defs.forEach((d, idx) => {
      const b = {
        x,
        w: d.w,
        h: d.h,
        color: d.color,
        frame: d.frame,
        name: d.name,
        kind: d.kind,
        station: d.kind === "stazione",
        people: d.people,
        balconies: [],
        cracks: [],
        state: "ok",
        t: 0,
        rubble: [],
        label: d.name,
        extra: d.people
      };

      if (d.kind !== "stazione") {
        const count = Math.max(3, Math.floor(d.w / 52));
        for (let i = 0; i < count; i++) {
          const px = b.x + 18 + i * ((b.w - 40) / Math.max(1, count - 1));
          b.balconies.push({ x: px, y: GROUND - 70 - ((i % 2) * 12), pot: true });
        }
      }

      buildings.push(b);
      x += b.w + 10;
    });

    // i binari partono da dopo l'officina, lungo l'area di manutenzione
    const railStart = buildings.filter(b => b.kind === "officina")[0].x + buildings.filter(b => b.kind === "officina")[0].w + 80;
    railVehicles = [
      { x: railStart + 40, y: GROUND - 28, w: 100, h: 30, type: "B40 Matisa", state: "ok" },
      { x: railStart + 180, y: GROUND - 28, w: 96, h: 32, type: "Pv7 Matisa", state: "ok" },
      { x: railStart + 330, y: GROUND - 28, w: 92, h: 30, type: "OBW-10FS Plasser", state: "ok" },
      { x: railStart + 470, y: GROUND - 28, w: 88, h: 28, type: "Theurer", state: "ok" }
    ];

    finalTrackStart = railStart + 620;
    gallinas = [];
    for (let i = 0; i < 22; i++) {
      gallinas.push({ x: finalTrackStart + 80 + i * 26, y: GROUND - 40 - (i % 2) * 6, phase: rand(0, 6.28) });
    }

    bushes = [];
    for (let i = 0; i < 40; i++) {
      const bx = finalTrackStart + 30 + i * 28;
      bushes.push({ x: bx, y: GROUND - 18 + (i % 2) * 8, size: rand(6, 14) });
    }

    WORLD = Math.max(2500, x + 1000);
    const finalB = buildings[buildings.length - 1];
    finalB.x = WORLD - 440;
    // corridoio finale: discesa + binari
    railEndX = finalB.x - 250;
  }

  let WORLD = 2400;
  let railVehicles = [];
  let gallinas = [];
  let bushes = [];
  let finalTrackStart = 0;
  let railEndX = 0;
  const keys = { left: false, right: false };
  const hero = { x: 230, dir: 1, walk: 0, shout: 0, cooldown: 0 };
  const citizens = [];
  const bubbleTexts = ["Maronna mia!", "Mi spavintai!", "Terremotu!", "Ahi, mamma mia!", "Ma chi fu?!", "Fujiti, fujiti!"];
  const insultTexts = ["Ferragì, statti citu!", "Tu si pazzu, Ferragì!", "Capu 'e mulu!", "Mbecille!", "Chi cumbinasti, Ferragì?!", "Vattinda, Ferragì!"];
  const shirtColors = ["#2a9d8f", "#e76f51", "#264653", "#9b5de5", "#f15bb5", "#00bbf9"];
  for (let i = 0; i < 8; i++) {
    citizens.push({
      x: rand(80, WORLD - 100),
      dir: Math.random() < 0.5 ? -1 : 1,
      color: shirtColors[i % shirtColors.length],
      scared: 0,
      phase: rand(0, 6),
      insulter: i % 3 === 0,
      bubble: ""
    });
  }

  const falling = [];
  const particles = [];
  const rings = [];
  let shake = 0;
  let camX = 0;
  const backParticles = [];
  const blasts = [];
  let plane = null;
  let planeTimer = 150;
  let planesDown = 0;
  let flash = 0;
  const car = { x: 620, alarm: 0 };
  let alarmOsc = null;
  let gameOver = false;
  let dog = null;
  let dogTimer = 0;

  // ---------- EFFETTI ----------
  function dust(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x: x + rand(-8, 8), y: y + rand(-8, 8),
        vx: rand(-1.5, 1.5), vy: rand(-1, 2),
        life: rand(30, 70), max: 70, color: color || "#d9cbb4", size: rand(2, 5)
      });
    }
  }

  function addCrack(b) {
    if (b.state !== "ok") return;
    const pts = [];
    let cx = b.x + 28 + rand(0, b.w - 56);
    let cy = GROUND - b.h + 18 + rand(0, b.h - 80);
    pts.push([cx, cy]);
    const n = 6 + Math.floor(rand(0, 5));
    for (let i = 0; i < n; i++) {
      cx = Math.max(b.x + 8, Math.min(b.x + b.w - 8, cx + rand(-18, 18)));
      cy += rand(10, 22);
      pts.push([cx, cy]);
    }
    b.cracks.push(pts);
    if (b.cracks.length >= COLLAPSE_AT) collapseBuilding(b);
  }

  function collapseBuilding(b) {
    b.state = "collapsing";
    b.t = 0;
    b.rubble = [];
    const colors = ["#8d7b6a", "#a0522d", "#777", "#b08968", "#6b5b4b"];
    for (let i = 0; i < 28; i++) {
      const w = rand(14, 38), h = rand(8, 25);
      b.rubble.push({
        x: b.x + rand(0, b.w - w),
        y: GROUND - h - rand(0, 20),
        w, h, c: colors[i % colors.length]
      });
    }
    b.balconies.forEach(bal => {
      if (bal.pot) {
        bal.pot = false;
        falling.push({ x: bal.x, y: bal.y - 14, vy: 0, rot: 0, vr: rand(-0.2, 0.2), kind: "pot" });
      }
    });
    shake = Math.max(shake, 70);
    rumble();
    crash(0.5);
    citizens.forEach(c => {
      c.scared = 320;
      c.bubble = b.station ? "Cadiu a stazioni!" : (Math.random() < 0.5 ? "Cadiu tuttu!" : "Fujiti, fujiti!");
      c.dir = c.x < b.x + b.w / 2 ? -1 : 1;
    });
  }

  function shout() {
    if (gameOver) return;
    if (hero.cooldown > 0) return;
    hero.shout = 100;
    hero.cooldown = 110;
    shake = Math.max(shake, 40);
    rings.push({ r: 10, a: 1 });
    rings.push({ r: -20, a: 1 });
    formantVoice();
    speakSalve();
    rumble();

    if (plane && plane.state === "flying" && plane.x > camX - 60 && plane.x < camX + W + 60) hitPlane();
    startCarAlarm();

    // mezzi gialli di manutenzione: possono rompersi al grido
    railVehicles.forEach(v => {
      if (v.state === "ok" && Math.abs(v.x - hero.x) < 180) {
        v.state = "broken";
        dust(v.x + 45, GROUND - 10, 18, "#f7c948");
        blastAt(v.x + 45, GROUND - 12, 25);
      }
    });

    buildings.forEach(b => {
      if (b.state !== "ok") return;
      if (Math.random() < 0.85) addCrack(b);
      if (b.state === "ok" && Math.random() < 0.5) addCrack(b);
      if (b.state !== "ok") return;
      dust(b.x + rand(10, b.w - 10), GROUND - b.h, 6);
      b.balconies.forEach(bal => {
        if (bal.pot && Math.random() < 0.45) {
          bal.pot = false;
          falling.push({ x: bal.x, y: bal.y - 14, vy: 0, rot: 0, vr: rand(-0.2, 0.2), kind: "pot" });
        }
      });
      if (Math.random() < 0.5) {
        falling.push({ x: b.x + rand(10, b.w - 10), y: GROUND - b.h, vy: 0, rot: 0, vr: rand(-0.3, 0.3), kind: "brick" });
      }
    });

    citizens.forEach(c => {
      if (c.scared > 200) return;
      c.scared = 260;
      const list = c.insulter ? insultTexts : bubbleTexts;
      c.bubble = list[Math.floor(Math.random() * list.length)];
      c.dir = c.x < hero.x ? -1 : 1;
    });

    // zona finale: Bingos morde Ferragine
    if (isNearStation() && !dog) {
      triggerBingos();
    }
  }

  function startCarAlarm() {
    car.alarm = 420;
    carAlarmSound();
  }

  function carAlarmSound() {
    const ac = getAudio();
    if (!ac) return;
    if (alarmOsc) { try { alarmOsc.stop(); } catch (e) {} }
    const t = ac.currentTime + 0.05;
    const dur = 7;
    const o = ac.createOscillator();
    o.type = "square";
    const lp = ac.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 3000;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.05);
    g.gain.setValueAtTime(0.16, t + dur - 0.3);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    for (let k = 0; k * 0.22 < dur; k++) {
      o.frequency.setValueAtTime(k % 2 ? 1250 : 850, t + k * 0.22);
    }
    o.connect(lp);
    lp.connect(g);
    g.connect(ac.destination);
    o.start(t);
    o.stop(t + dur);
    alarmOsc = o;
  }

  function emitBack(x, y, n, color, size, vy, life, g) {
    for (let i = 0; i < n; i++) {
      backParticles.push({
        x: x + rand(-6, 6), y: y + rand(-6, 6),
        vx: rand(-1, 1), vy: vy + rand(-0.8, 0.8),
        life: rand(life * 0.6, life), max: life,
        color, size: rand(size * 0.6, size), round: true, g
      });
    }
  }

  function boom() {
    rumble();
    const ac = getAudio();
    if (!ac) return;
    const t = ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = noiseBuffer(ac, 1.5);
    const lp = ac.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(900, t);
    lp.frequency.exponentialRampToValueAtTime(120, t + 1.4);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
    src.connect(lp);
    lp.connect(g);
    g.connect(ac.destination);
    src.start(t);
  }

  function blastAt(x, y, r = 22) {
    for (let i = 0; i < 22; i++) {
      const a = rand(0, 6.28), s = rand(1, 4.5);
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s - 1.5,
        life: rand(18, 40),
        max: 40,
        color: "#ffbb33",
        size: rand(3, 7)
      });
    }
    blasts.push({ x, y, t: 0, rad: r });
  }

  function spawnPlane() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    plane = {
      x: dir > 0 ? camX - 120 : camX + W + 120,
      y: rand(55, 110),
      dir, state: "flying", vy: 0, angle: 0
    };
  }

  function hitPlane() {
    if (!plane) return;
    plane.state = "falling";
    plane.vy = 0;
    plane.angle = 0;
  }

  function explode(x, y) {
    const fireColors = ["#ffcc33", "#ff8c1a", "#e63900", "#fff3b0"];
    for (let i = 0; i < 70; i++) {
      const a = rand(0, 6.28), s = rand(1, 6);
      backParticles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2,
        life: rand(25, 60), max: 60, color: fireColors[i % 4],
        size: rand(6, 18), round: true, g: 0.03
      });
    }
    for (let i = 0; i < 45; i++) {
      backParticles.push({
        x: x + rand(-25, 25), y: y + rand(-10, 10),
        vx: rand(-1, 1), vy: -rand(1, 3),
        life: rand(100, 170), max: 170, color: i % 2 ? "#3a3a3a" : "#575757",
        size: rand(10, 24), round: true, g: -0.01
      });
    }
    blasts.push({ x, y, t: 0 });
    flash = 1;
    shake = Math.max(shake, 70);
    boom();
    planesDown++;
    buildings.forEach(b => {
      if (b.state === "ok" && Math.abs(b.x + b.w / 2 - x) < 300) {
        addCrack(b);
        if (b.state === "ok") addCrack(b);
      }
    });
    citizens.forEach(c => {
      c.scared = 320;
      c.bubble = c.insulter ? "Ferragì, l'aeroplanu!" : "Cadiu l'aeroplanu!";
      c.dir = c.x < x ? -1 : 1;
    });
  }

  function repair() {
    buildings.forEach(b => {
      b.cracks = [];
      b.state = "ok";
      b.t = 0;
      b.rubble = [];
      b.balconies.forEach(bal => (bal.pot = true));
    });
    railVehicles.forEach(v => (v.state = "ok"));
    falling.length = 0;
    if (dog) dog = null;
    gameOver = false;
    dogTimer = 0;
  }

  // ---------- INPUT ----------
  window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") keys.left = true;
    if (e.key === "ArrowRight") keys.right = true;
    if (e.code === "Space") { e.preventDefault(); getAudio(); shout(); }
    if (e.key === "r" || e.key === "R") repair();
  });
  window.addEventListener("keyup", e => {
    if (e.key === "ArrowLeft") keys.left = false;
    if (e.key === "ArrowRight") keys.right = false;
  });

  function hold(id, key) {
    const el = document.getElementById(id);
    const on = e => { e.preventDefault(); keys[key] = true; };
    const off = e => { e.preventDefault(); keys[key] = false; };
    el.addEventListener("pointerdown", on);
    el.addEventListener("pointerup", off);
    el.addEventListener("pointerleave", off);
    el.addEventListener("pointercancel", off);
  }
  hold("left", "left");
  hold("right", "right");
  document.getElementById("hello").addEventListener("click", () => { getAudio(); shout(); });
  document.getElementById("repair").addEventListener("click", repair);
  window.addEventListener("pointerdown", () => getAudio(), { once: true });

  function isNearStation() {
    const last = buildings[buildings.length - 1];
    return hero.x > last.x - 120 && hero.x < last.x + last.w + 220;
  }

  function triggerBingos() {
    dog = {
      x: buildings[buildings.length - 1].x + 35,
      y: GROUND - 28,
      dir: -1,
      bite: 0,
      state: "run"
    };
    shake = Math.max(shake, 35);
    crash(0.24);
  }

  function loseGame() {
    gameOver = true;
    dog = null;
    hero.shout = 0;
    shake = Math.max(shake, 80);
    crash(0.8);
  }

  // ---------- UPDATE ----------
  function update() {
    if (gameOver) return;

    let moving = false;
    if (keys.left) { hero.x -= 3.2; hero.dir = -1; moving = true; }
    if (keys.right) { hero.x += 3.2; hero.dir = 1; moving = true; }
    hero.x = Math.max(40, Math.min(WORLD - 40, hero.x));
    if (moving) hero.walk += 0.2;
    if (hero.shout > 0) hero.shout--;
    if (hero.cooldown > 0) hero.cooldown--;

    citizens.forEach(c => {
      c.phase += 0.15;
      if (c.scared > 0) {
        c.scared--;
        c.x += c.dir * 4;
        if (c.x < 40 || c.x > WORLD - 40) c.dir *= -1;
      } else {
        if (Math.random() < 0.005) c.dir *= -1;
        c.x += c.dir * 0.7;
        if (c.x < 40 || c.x > WORLD - 40) c.dir *= -1;
      }
      c.x = Math.max(30, Math.min(WORLD - 30, c.x));
    });

    buildings.forEach(b => {
      if (b.state !== "collapsing") return;
      b.t += 1 / 150;
      shake = Math.max(shake, 14);
      const topY = GROUND - b.h + b.t * b.h;
      if (Math.random() < 0.6) dust(b.x + rand(0, b.w), topY, 3);
      if (Math.random() < 0.08) {
        falling.push({ x: b.x + rand(0, b.w), y: topY, vy: 0, rot: 0, vr: rand(-0.3, 0.3), kind: "brick" });
      }
      if (b.t >= 1) {
        b.state = "ruin";
        dust(b.x + b.w / 2, GROUND - 10, 50);
      }
    });

    for (let i = falling.length - 1; i >= 0; i--) {
      const f = falling[i];
      f.vy += 0.5;
      f.y += f.vy;
      f.rot += f.vr;
      if (f.y >= GROUND - 6) {
        dust(f.x, GROUND - 6, 10, f.kind === "pot" ? "#c1693c" : "#9a8c7a");
        if (Math.abs(f.x - camX - W / 2) < W) crash(0.2);
        falling.splice(i, 1);
      }
    }

    [particles, backParticles].forEach(arr => {
      for (let i = arr.length - 1; i >= 0; i--) {
        const p = arr[i];
        p.x += p.vx; p.y += p.vy; p.vy += (p.g === undefined ? 0.05 : p.g); p.life--;
        if (p.life <= 0) arr.splice(i, 1);
      }
    });

    for (let i = blasts.length - 1; i >= 0; i--) {
      blasts[i].t++;
      if (blasts[i].t > 30) blasts.splice(i, 1);
    }

    if (flash > 0) flash = Math.max(0, flash - 0.04);
    if (car.alarm > 0) car.alarm--;

    if (!plane) {
      planeTimer--;
      if (planeTimer <= 0) spawnPlane();
    } else if (plane.state === "flying") {
      plane.x += plane.dir * 2.6;
      if (Math.abs(plane.x - (camX + W / 2)) > 700) {
        plane = null;
        planeTimer = rand(250, 500);
      }
    } else {
      plane.vy = Math.min(7, plane.vy + 0.07);
      plane.y += plane.vy;
      plane.x += plane.dir * 2.0;
      plane.angle = Math.min(1.2, plane.angle + 0.012);
      emitBack(plane.x - plane.dir * 40, plane.y, 2, "#2b2b2b", 12, -0.3, 60, -0.01);
      emitBack(plane.x - plane.dir * 40, plane.y, 1, "#ff8c1a", 8, 0, 25, 0);
      if (plane.y >= GROUND - 70) {
        explode(plane.x, GROUND - 70);
        plane = null;
        planeTimer = rand(500, 800);
      }
    }

    if (dog) {
      dog.x += dog.dir * 3.1;
      if (dog.x < buildings[buildings.length - 1].x + 35) dog.dir = 1;
      if (hero.x - dog.x < 24 && hero.x - dog.x > -24 && dog.state === "run") {
        dog.bite++;
        dog.state = "bite";
        loseGame();
      }
    }

    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].r += 9;
      if (rings[i].r > 0) rings[i].a -= 0.02;
      if (rings[i].a <= 0) rings.splice(i, 1);
    }

    if (shake > 0) shake *= 0.96;
    if (shake < 0.3) shake = 0;

    const target = Math.max(0, Math.min(WORLD - W, hero.x - W / 2));
    camX += (target - camX) * 0.12;
  }

  // ---------- DISEGNO ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, "#7ab8f5");
    g.addColorStop(1, "#d6ecff");
    ctx.fillStyle = g;
    ctx.fillRect(-50, -50, W + 100, H + 100);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    [[120, 70], [420, 50], [650, 90]].forEach(([cx, cy]) => {
      const x = ((cx - camX * 0.2) % (W + 200) + W + 200) % (W + 200) - 100;
      ctx.beginPath();
      ctx.arc(x, cy, 22, 0, 7);
      ctx.arc(x + 25, cy + 4, 18, 0, 7);
      ctx.arc(x - 25, cy + 6, 16, 0, 7);
      ctx.fill();
    });
  }

  function drawPot(x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = "#c1693c";
    ctx.fillRect(-8, -2, 16, 12);
    ctx.fillStyle = "#2d8a3e";
    ctx.beginPath();
    ctx.arc(0, -6, 8, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  function drawBrick(x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = "#a44a3f";
    ctx.fillRect(-8, -4, 16, 8);
    ctx.restore();
  }

  function drawCracks(b) {
    ctx.strokeStyle = "#2b2b2b";
    ctx.lineWidth = 2;
    b.cracks.forEach(c => {
      ctx.beginPath();
      c.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.stroke();
      // linee secondarie per fessure più dettagliate
      if (c.length > 3) {
        ctx.beginPath();
        for (let i = 0; i < c.length - 1; i++) {
          const [x1, y1] = c[i];
          const [x2, y2] = c[i + 1];
          const mx = (x1 + x2) / 2;
          const my = (y1 + y2) / 2;
          if (i === 0) ctx.moveTo(mx, my); else ctx.lineTo(mx, my);
        }
        ctx.stroke();
      }
    });
  }

  function drawStationFacade(b) {
    const top = GROUND - b.h;
    const cx = b.x + b.w / 2;
    ctx.fillStyle = "#eadfc4";
    ctx.fillRect(b.x, top, b.w, b.h);
    ctx.fillStyle = "#7a3b2e";
    ctx.fillRect(b.x - 6, top - 8, b.w + 12, 10);
    ctx.fillStyle = "#b3262e";
    ctx.fillRect(b.x, top + 6, b.w, 28);
    ctx.save();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("CZ LIDO", cx, top + 26);
    ctx.restore();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(cx, top + 58, 15, 0, 7); ctx.fill();
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, top + 58); ctx.lineTo(cx, top + 48);
    ctx.moveTo(cx, top + 58); ctx.lineTo(cx + 7, top + 61);
    ctx.stroke();
    for (let i = 0; i < 8; i++) {
      const wx = b.x + 30 + i * ((b.w - 80) / 7);
      ctx.fillStyle = "#35506b";
      ctx.fillRect(wx, top + 82, 22, 26);
      ctx.fillStyle = "rgba(255,255,255,.25)";
      ctx.fillRect(wx, top + 82, 8, 26);
    }
    for (let i = 0; i < 3; i++) {
      const x = b.x + b.w * (0.2 + 0.3 * i);
      ctx.fillStyle = "#35506b";
      ctx.beginPath();
      ctx.moveTo(x - 24, GROUND);
      ctx.lineTo(x - 24, GROUND - 60);
      ctx.arc(x, GROUND - 60, 24, Math.PI, 0);
      ctx.lineTo(x + 24, GROUND);
      ctx.fill();
    }
    drawCracks(b);
  }

  function drawFacadePeople(b) {
    if (!b.people || !b.people.length) return;
    const baseY = GROUND - b.h + 24;
    b.people.forEach((p, idx) => {
      const px = b.x + 40 + (idx % 3) * (b.w / 3.5);
      const py = baseY + 12 + Math.floor(idx / 3) * 38;
      ctx.save();
      ctx.translate(px, py);
      ctx.fillStyle = p.color || "#d9d9d9";
      ctx.fillRect(-8, -12, 16, 26);
      ctx.fillStyle = "#e2bf9c";
      ctx.beginPath(); ctx.arc(0, -22, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#1a1a1a";
      if (p.glasses && p.glasses.includes("da sole")) {
        ctx.fillRect(-9, -24, 5, 3); ctx.fillRect(4, -24, 5, 3); ctx.fillRect(-4, -24, 8, 2);
      } else if (p.glasses && p.glasses.includes("rettangolari")) {
        ctx.fillRect(-9, -24, 7, 3); ctx.fillRect(2, -24, 7, 3);
      } else if (p.glasses && p.glasses.includes("normali")) {
        ctx.fillRect(-8, -24, 6, 3); ctx.fillRect(2, -24, 6, 3);
      }
      if (p.name === "Paky") {
        ctx.strokeStyle = "#6d4a2d";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-10, -32); ctx.lineTo(-4, -28); ctx.stroke();
      }
      if (p.name === "Tonino") {
        ctx.strokeStyle = "#1a1a1a";
        ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(14, -4); ctx.stroke();
      }
      if (p.name === "Donato") {
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(-15, -10, 30, 3);
      }
      if (p.name === "Bingos") {
        ctx.fillStyle = "#8b5a2b"; ctx.fillRect(-12, 8, 24, 8); ctx.beginPath(); ctx.arc(0, -18, 9, 0, 7); ctx.fill();
      }
      ctx.restore();
    });
  }

  function drawBuildingBody(b) {
    if (b.station) { drawStationFacade(b); drawFacadePeople(b); return; }
    const top = GROUND - b.h;
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, top, b.w, b.h);
    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.fillRect(b.x, top, b.w, 10);
    ctx.fillStyle = b.frame;
    ctx.fillRect(b.x - 4, top - 8, b.w + 8, 10);
    ctx.fillStyle = "#5a3825";
    ctx.fillRect(b.x + b.w / 2 - 15, GROUND - 55, 30, 55);

    b.balconies.forEach(bal => {
      ctx.fillStyle = "#35506b";
      ctx.fillRect(bal.x - 15, bal.y - 62, 30, 55);
      ctx.fillStyle = "rgba(255,255,255,.25)";
      ctx.fillRect(bal.x - 15, bal.y - 62, 14, 55);
      ctx.fillStyle = "#555";
      ctx.fillRect(bal.x - 26, bal.y, 52, 6);
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 2;
      ctx.strokeRect(bal.x - 24, bal.y - 18, 48, 18);
      for (let i = -18; i <= 18; i += 9) {
        ctx.beginPath(); ctx.moveTo(bal.x + i, bal.y - 18); ctx.lineTo(bal.x + i, bal.y); ctx.stroke();
      }
      if (bal.pot) drawPot(bal.x, bal.y - 12, 0);
    });

    drawCracks(b);
    drawFacadePeople(b);
  }

  function drawRubble(b, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    b.rubble.forEach(r => {
      ctx.fillStyle = r.c;
      ctx.fillRect(r.x, r.y, r.w, r.h);
    });
    ctx.restore();
  }

  function drawBuilding(b) {
    if (b.state === "ok") {
      drawBuildingBody(b);
    } else if (b.state === "collapsing") {
      ctx.save();
      ctx.beginPath();
      ctx.rect(b.x - 12, 0, b.w + 24, GROUND);
      ctx.clip();
      ctx.translate(rand(-2, 2) * (1 - b.t), b.t * b.h * 0.97);
      drawBuildingBody(b);
      ctx.restore();
      drawRubble(b, Math.min(1, b.t * 2));
    } else {
      drawRubble(b, 1);
    }
  }

  function drawHills() {
    ctx.fillStyle = "#86ad9f";
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    for (let x = 0; x <= W; x += 20) {
      const wx = x + camX * 0.3;
      const y = GROUND - 120 - Math.sin(wx * 0.008) * 40 - Math.sin(wx * 0.021) * 18;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, GROUND);
    ctx.closePath();
    ctx.fill();
  }

  function drawPlane(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(p.dir, 1);
    ctx.rotate(p.angle || 0);
    ctx.fillStyle = "#b0bec5";
    ctx.beginPath();
    ctx.moveTo(6, 2); ctx.lineTo(-14, 20); ctx.lineTo(-26, 20); ctx.lineTo(-12, 2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c62828";
    ctx.beginPath();
    ctx.moveTo(-46, -4); ctx.lineTo(-56, -26); ctx.lineTo(-42, -26); ctx.lineTo(-30, -4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f5f5f5";
    ctx.beginPath(); ctx.ellipse(0, 0, 50, 10, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#c62828";
    ctx.fillRect(-40, 3, 80, 2);
    ctx.fillStyle = "#37474f";
    for (let x = -30; x <= 28; x += 8) {
      ctx.beginPath(); ctx.arc(x, -2, 2, 0, 7); ctx.fill();
    }
    ctx.beginPath(); ctx.ellipse(38, -3, 6, 3, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#90a4ae";
    ctx.beginPath(); ctx.ellipse(-4, 13, 10, 4, 0, 0, 7); ctx.fill();
    if (p.state === "falling") {
      ctx.fillStyle = "#ff8c1a";
      ctx.beginPath(); ctx.arc(-52, 0, rand(6, 11), 0, 7); ctx.fill();
      ctx.fillStyle = "#ffe066";
      ctx.beginPath(); ctx.arc(-50, 0, rand(3, 6), 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function drawParticle(p) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    if (p.round) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, 7);
      ctx.fill();
    } else {
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
  }

  function drawCar() {
    const on = car.alarm > 0;
    const blink = on && Math.floor(car.alarm / 14) % 2 === 0;
    ctx.save();
    ctx.translate(car.x + (on ? rand(-1, 1) : 0), GROUND + 34);
    ctx.fillStyle = "rgba(0,0,0,.3)";
    ctx.beginPath(); ctx.ellipse(0, 0, 85, 7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#15171a";
    ctx.beginPath(); ctx.roundRect(-74, -40, 148, 26, 9); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-50, -38); ctx.lineTo(-38, -62); ctx.lineTo(30, -62); ctx.lineTo(54, -38);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#4d6272";
    ctx.beginPath();
    ctx.moveTo(-43, -40); ctx.lineTo(-34, -58); ctx.lineTo(-4, -58); ctx.lineTo(-4, -40);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(2, -40); ctx.lineTo(2, -58); ctx.lineTo(28, -58); ctx.lineTo(46, -40);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.16)";
    ctx.beginPath();
    ctx.moveTo(-30, -57); ctx.lineTo(-18, -57); ctx.lineTo(-30, -42); ctx.lineTo(-38, -42);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.14)";
    ctx.fillRect(-70, -36, 140, 2);
    ctx.fillStyle = "#3a3d42";
    ctx.fillRect(-14, -33, 8, 2);
    ctx.fillRect(16, -33, 8, 2);
    [-46, 46].forEach(wx => {
      ctx.fillStyle = "#050505";
      ctx.beginPath(); ctx.arc(wx, -14, 17, 0, 7); ctx.fill();
      ctx.fillStyle = "#222";
      ctx.beginPath(); ctx.arc(wx, -12, 13, 0, 7); ctx.fill();
      ctx.fillStyle = "#9aa0a6";
      ctx.beginPath(); ctx.arc(wx, -12, 6, 0, 7); ctx.fill();
      ctx.fillStyle = "#555";
      ctx.beginPath(); ctx.arc(wx, -12, 2, 0, 7); ctx.fill();
    });
    ctx.fillStyle = blink ? "#fff7c2" : "#cfd8dc";
    ctx.fillRect(68, -36, 7, 6);
    ctx.fillStyle = on ? "#ff2a2a" : "#8b1a1a";
    ctx.fillRect(-76, -36, 5, 8);
    if (blink) {
      ctx.fillStyle = "#ff9f1c";
      ctx.beginPath(); ctx.arc(72, -26, 5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(-73, -26, 5, 0, 7); ctx.fill();
      [[74, -30], [-74, -30]].forEach(([gx, gy]) => {
        const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 45);
        g.addColorStop(0, "rgba(255,159,28,.55)");
        g.addColorStop(1, "rgba(255,159,28,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(gx, gy, 45, 0, 7); ctx.fill();
      });
    }
    ctx.restore();

    if (blink) {
      ctx.save();
      ctx.font = "bold 22px Impact, sans-serif";
      ctx.textAlign = "center";
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#000";
      ctx.fillStyle = "#ffb703";
      ctx.strokeText("UIII UIII UIII!", car.x, GROUND - 38);
      ctx.fillText("UIII UIII UIII!", car.x, GROUND - 38);
      ctx.restore();
    }
  }

  function drawRailVehicle(v) {
    if (v.state !== "ok") {
      ctx.save();
      ctx.fillStyle = "#4d3b2a";
      ctx.fillRect(v.x, v.y, v.w, v.h);
      ctx.fillStyle = "#ffab40";
      ctx.fillRect(v.x + 8, v.y + 6, v.w - 16, 12);
      ctx.fillStyle = "#000";
      ctx.fillRect(v.x + 10, v.y + 14, 14, 7);
      ctx.fillRect(v.x + v.w - 24, v.y + 14, 14, 7);
      for (let i = 0; i < 6; i++) {
        const sx = v.x + 12 + i * 15;
        ctx.fillStyle = "rgba(255,255,255,.2)";
        ctx.fillRect(sx, v.y + 5, 5, 4);
      }
      ctx.restore();
      return;
    }

    ctx.save();
    ctx.translate(v.x, v.y);
    ctx.fillStyle = "#f1c40f";
    ctx.fillRect(0, 0, v.w, v.h);
    ctx.fillStyle = "#d99d00";
    ctx.fillRect(10, 5, v.w - 20, 8);
    ctx.fillStyle = "#d5d5d5";
    ctx.fillRect(12, 12, v.w - 24, 7);
    ctx.fillStyle = "#2a2a2a";
    ctx.fillRect(12, 18, v.w - 24, 4);
    ctx.fillStyle = "#000";
    ctx.fillRect(8, 0, 5, 14);
    ctx.fillRect(v.w - 13, 0, 5, 14);
    ctx.fillRect(22, 0, 6, 14);
    ctx.fillRect(v.w - 28, 0, 6, 14);
    ctx.restore();
  }

  function drawTracks() {
    const start = Math.max(0, finalTrackStart - 150);
    const end = WORLD + 100;
    const y = GROUND + 24;
    ctx.fillStyle = "#67717e";
    ctx.fillRect(start, y, end - start, 18);
    ctx.strokeStyle = "#d8d8d8";
    ctx.lineWidth = 2;
    for (let x = start; x < end; x += 28) {
      ctx.beginPath();
      ctx.moveTo(x, y + 2);
      ctx.lineTo(x + 12, y + 16);
      ctx.stroke();
    }
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(start, y + 7);
    ctx.lineTo(end, y + 7);
    ctx.moveTo(start, y + 13);
    ctx.lineTo(end, y + 13);
    ctx.stroke();
    // tratto in discesa finale
    ctx.beginPath();
    ctx.moveTo(railEndX, GROUND + 18);
    ctx.lineTo(WORLD - 40, GROUND - 110);
    ctx.stroke();
  }

  function drawBushes() {
    bushes.forEach(b => {
      ctx.fillStyle = "#3f8f4d";
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.size, 0, 7);
      ctx.fill();
    });
  }

  function drawGalline() {
    gallinas.forEach((g, idx) => {
      const x = g.x;
      const y = g.y + Math.sin(g.phase + idx) * 2;
      ctx.fillStyle = "#f2d97c";
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, 7);
      ctx.fill();
      ctx.fillStyle = "#d2b15d";
      ctx.fillRect(x - 3, y + 6, 6, 4);
      ctx.fillStyle = "#111";
      ctx.fillRect(x - 2, y - 1, 2, 2);
      ctx.fillRect(x + 2, y - 1, 2, 2);
    });
  }

  function drawDog() {
    if (!dog) return;
    ctx.save();
    ctx.translate(dog.x, dog.y);
    ctx.fillStyle = "#8a5a2d";
    ctx.beginPath();
    ctx.ellipse(0, 0, 18, 9, 0, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-8, -12, 8, 0, 7); ctx.fill();
    ctx.fillStyle = "#7a4720";
    ctx.fillRect(10, -2, 12, 5);
    ctx.fillStyle = "#111";
    ctx.fillRect(-12, -15, 3, 3);
    ctx.fillRect(-3, -15, 3, 3);
    ctx.restore();
  }

  function drawHero() {
    const d = hero.dir;
    const shouting = hero.shout > 0;
    const swing = Math.sin(hero.walk) * 12;
    const SKIN = "#e0a373";
    const HAIR = "#3b2a20";

    ctx.save();
    ctx.translate(hero.x, GROUND);
    if (shouting) ctx.translate(rand(-2, 2), rand(-1, 1));

    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.beginPath(); ctx.ellipse(0, 2, 30, 6, 0, 0, 7); ctx.fill();

    ctx.scale(0.76, 0.76);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.strokeStyle = "#2f3e6b";
    ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(-8, -62); ctx.lineTo(-8 + swing, -6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, -62); ctx.lineTo(8 - swing, -6); ctx.stroke();
    ctx.fillStyle = "#222";
    ctx.beginPath(); ctx.ellipse(-8 + swing + d * 4, -3, 11, 5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8 - swing + d * 4, -3, 11, 5, 0, 0, 7); ctx.fill();

    ctx.fillStyle = "#18181b";
    ctx.beginPath();
    ctx.moveTo(-24, -120);
    ctx.lineTo(24, -120);
    ctx.lineTo(20, -58);
    ctx.lineTo(-20, -58);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.14)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -112); ctx.lineTo(0, -92); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-14, -90); ctx.quadraticCurveTo(0, -84, 14, -90); ctx.stroke();

    ctx.fillStyle = "#18181b";
    ctx.beginPath(); ctx.arc(-26, -113, 9, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(26, -113, 9, 0, 7); ctx.fill();

    ctx.strokeStyle = SKIN;
    ctx.lineWidth = 12;
    if (shouting) {
      ctx.beginPath(); ctx.moveTo(-26, -108); ctx.lineTo(d * 8, -128); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(26, -108); ctx.lineTo(d * 22, -132); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-28, -106); ctx.lineTo(-30 - swing * 0.5, -66); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(28, -106); ctx.lineTo(30 + swing * 0.5, -66); ctx.stroke();
      ctx.fillStyle = SKIN;
      ctx.beginPath(); ctx.ellipse(-29 - swing * 0.25, -88, 7, 12, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(29 + swing * 0.25, -88, 7, 12, 0, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = "#18181b";
    ctx.lineWidth = 15;
    if (shouting) {
      ctx.beginPath(); ctx.moveTo(-27, -110); ctx.lineTo(-20, -116); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(27, -110); ctx.lineTo(23, -116); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-28, -110); ctx.lineTo(-29, -98); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(28, -110); ctx.lineTo(29, -98); ctx.stroke();
    }

    ctx.fillStyle = SKIN;
    ctx.fillRect(-9, -134, 18, 14);
    ctx.beginPath(); ctx.ellipse(0, -148, 18, 20, 0, 0, 7); ctx.fill();

    ctx.fillStyle = HAIR;
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = 2;
    [-14, -12, -10, -8, -6, -4, -2, 0, 2, 4, 6, 8, 10, 12, 14].forEach((x, i) => {
      const y = -148 - 20 * Math.sqrt(1 - (x / 18) * (x / 18)) + 1;
      ctx.beginPath();
      ctx.moveTo(x, y + 2);
      ctx.lineTo(x + (i % 2 ? 1 : -1), y - 2.5);
      ctx.stroke();
    });

    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.moveTo(-16, -142);
    ctx.quadraticCurveTo(-18, -123, 0, -124);
    ctx.quadraticCurveTo(18, -123, 16, -142);
    ctx.quadraticCurveTo(12, -132, 0, -130);
    ctx.quadraticCurveTo(-12, -132, -16, -142);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath(); ctx.ellipse(-5, -140, 6, 2, 0.2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5, -140, 6, 2, -0.2, 0, 7); ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.fillRect(d * 4 - 5, -153, 8, 5);
    ctx.fillRect(d * 4 + 6, -153, 8, 5);
    ctx.fillStyle = "#000";
    ctx.fillRect(d * 4 - 2 + d * 2, -152, 3, 3);
    ctx.fillRect(d * 4 + 9 + d * 2, -152, 3, 3);
    ctx.strokeStyle = HAIR;
    ctx.lineWidth = shouting ? 4 : 3;
    const tilt = shouting ? 3 : 0;
    ctx.beginPath(); ctx.moveTo(d * 4 - 6, -157 + tilt); ctx.lineTo(d * 4 + 4, -157 - tilt); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(d * 4 + 5, -157 - tilt); ctx.lineTo(d * 4 + 15, -157 + tilt); ctx.stroke();

    if (shouting) {
      ctx.fillStyle = "#4a0d0d";
      ctx.beginPath(); ctx.ellipse(d * 5, -131, 8, 11, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillRect(d * 5 - 5, -141, 10, 3);
    } else {
      ctx.fillStyle = "#7a2e2e";
      ctx.fillRect(d * 5 - 5, -134, 10, 2);
    }
    ctx.restore();

    if (shouting) {
      ctx.save();
      ctx.font = "bold 40px Impact, sans-serif";
      ctx.textAlign = "center";
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#000";
      ctx.fillStyle = "#ffd23f";
      const tx = hero.x + rand(-3, 3), ty = GROUND - 150 + rand(-3, 3);
      ctx.strokeText("SAAAALVEEE!", tx, ty);
      ctx.fillText("SAAAALVEEE!", tx, ty);
      ctx.restore();
    }
  }

  function drawCitizen(c) {
    const scared = c.scared > 0;
    const bounce = scared ? Math.abs(Math.sin(c.phase * 1.5)) * 10 : 0;
    const swing = Math.sin(c.phase) * (scared ? 12 : 6);
    const base = GROUND - bounce;

    ctx.save();
    ctx.translate(c.x, 0);
    ctx.fillStyle = "rgba(0,0,0,.2)";
    ctx.beginPath(); ctx.ellipse(0, GROUND + 2, 14, 4, 0, 0, 7); ctx.fill();

    ctx.strokeStyle = "#333";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-4, base - 28); ctx.lineTo(-4 + swing, base - 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, base - 28); ctx.lineTo(4 - swing, base - 2); ctx.stroke();

    ctx.fillStyle = c.color;
    ctx.beginPath(); ctx.roundRect(-10, base - 56, 20, 32, 5); ctx.fill();

    ctx.strokeStyle = "#e0b48a";
    ctx.lineWidth = 5;
    if (scared) {
      ctx.beginPath(); ctx.moveTo(-10, base - 50); ctx.lineTo(-16, base - 74 + Math.sin(c.phase * 2) * 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10, base - 50); ctx.lineTo(16, base - 74 - Math.sin(c.phase * 2) * 4); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-10, base - 50); ctx.lineTo(-12 - swing * 0.4, base - 30); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10, base - 50); ctx.lineTo(12 + swing * 0.4, base - 30); ctx.stroke();
    }

    ctx.fillStyle = "#e0b48a";
    ctx.beginPath(); ctx.arc(0, base - 66, 11, 0, 7); ctx.fill();
    ctx.fillStyle = "#4a3320";
    ctx.beginPath(); ctx.arc(0, base - 70, 11, Math.PI, 0); ctx.fill();

    ctx.fillStyle = "#000";
    if (scared) {
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(-4, base - 67, 3.5, 0, 7); ctx.arc(4, base - 67, 3.5, 0, 7); ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.arc(-4, base - 67, 1.5, 0, 7); ctx.arc(4, base - 67, 1.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, base - 59, 3, 4, 0, 0, 7); ctx.fill();
    } else {
      ctx.fillRect(-5, base - 68, 2, 2);
      ctx.fillRect(3, base - 68, 2, 2);
    }
    ctx.restore();

    if (scared && c.scared > 140) {
      ctx.save();
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "center";
      const w = ctx.measureText(c.bubble).width + 12;
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(c.x - w / 2, base - 104, w, 22, 8);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#c1121f";
      ctx.fillText(c.bubble, c.x, base - 89);
      ctx.restore();
    }
  }

  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.4, rand(-shake, shake) * 0.4);
    drawSky();
    drawHills();

    ctx.save();
    ctx.translate(-camX, 0);
    if (plane) drawPlane(plane);
    backParticles.forEach(drawParticle);
    ctx.globalAlpha = 1;
    blasts.forEach(bl => {
      const r = 40 + bl.t * 7;
      const g = ctx.createRadialGradient(bl.x, bl.y, 0, bl.x, bl.y, r);
      g.addColorStop(0, "rgba(255,240,180," + (1 - bl.t / 30) + ")");
      g.addColorStop(0.5, "rgba(255,120,20," + (0.8 * (1 - bl.t / 30)) + ")");
      g.addColorStop(1, "rgba(255,60,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(bl.x, bl.y, r, 0, 7);
      ctx.fill();
    });

    buildings.forEach(b => {
      if (b.x + b.w > camX - 20 && b.x < camX + W + 20) drawBuilding(b);
    });

    drawBushes();
    drawTracks();
    railVehicles.forEach(drawRailVehicle);
    drawGalline();
    drawDog();

    ctx.fillStyle = "#6b6b6b";
    ctx.fillRect(camX - 50, GROUND, W + 100, H - GROUND);
    ctx.fillStyle = "#9a9a9a";
    ctx.fillRect(camX - 50, GROUND, W + 100, 8);
    ctx.fillStyle = "#e8e8e8";
    for (let x = Math.floor(camX / 80) * 80; x < camX + W + 80; x += 80) {
      ctx.fillRect(x, GROUND + 45, 40, 5);
    }

    falling.forEach(f => (f.kind === "pot" ? drawPot(f.x, f.y, f.rot) : drawBrick(f.x, f.y, f.rot)));
    drawCar();
    citizens.forEach(drawCitizen);
    drawHero();

    rings.forEach(r => {
      if (r.r <= 0) return;
      ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, r.a)})`;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(hero.x, GROUND - 100, r.r, r.r * 0.6, 0, 0, 7);
      ctx.stroke();
    });

    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.restore();

    const down = buildings.filter(b => b.state !== "ok").length;
    ctx.font = "bold 16px sans-serif";
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#000";
    ctx.fillStyle = "#fff";
    if (flash > 0) {
      ctx.fillStyle = "rgba(255,190,90," + (flash * 0.55) + ")";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
    }
    const txt = "Palazzi crollati: " + down + "/" + buildings.length;
    ctx.strokeText(txt, 10, 24);
    ctx.fillText(txt, 10, 24);
    const txt2 = "Aerei abbattuti: " + planesDown;
    ctx.strokeText(txt2, 10, 46);
    ctx.fillText(txt2, 10, 46);
    ctx.textAlign = "right";
    ctx.strokeText("LAMEZIA TERME", W - 10, 24);
    ctx.fillText("LAMEZIA TERME", W - 10, 24);
    ctx.textAlign = "left";

    if (gameOver) {
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#ffec99";
      ctx.textAlign = "center";
      ctx.font = "bold 48px sans-serif";
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 6;
      ctx.strokeText(strings.fail, W / 2, H / 2 - 20);
      ctx.fillText(strings.fail, W / 2, H / 2 - 20);
      ctx.font = "bold 22px sans-serif";
      ctx.strokeText(strings.stop, W / 2, H / 2 + 30);
      ctx.fillText(strings.stop, W / 2, H / 2 + 30);
      ctx.restore();
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  makeCity();
  startCarAlarm();
  loop();
})();
</script>
</body>
</html>
